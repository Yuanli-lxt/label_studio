benchmark_id: benchmark_v0_1_coco300
random_seed: 42
max_samples_total: 300

datasets:
  coco:
    enabled: true
    images_dir: data/external/coco/val2017
    annotations_file: data/external/coco/annotations/instances_val2017.json
    max_samples: 300

sampling:
  strategy: stratified
  category_balance: true
  image_diversity: true
  max_instances_per_image: 3
  include_tags:
    - small_object
    - touches_border
    - elongated_object
    - crowded_or_multi_instance
