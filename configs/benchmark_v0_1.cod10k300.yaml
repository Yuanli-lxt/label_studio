benchmark_id: benchmark_v0_1_cod10k300
random_seed: 42
max_samples_total: 300

datasets:
  cod10k:
    enabled: true
    images_dir: data/external/cod10k/images
    masks_dir: data/external/cod10k/masks
    max_samples: 300
    image_glob: "**/*.jpg,**/*.jpeg,**/*.png,**/*.bmp"
    mask_glob: "**/*.png,**/*.jpg,**/*.bmp"
    include_image_patterns:
      - "COD10K-CAM-*"
    include_mask_patterns:
      - "COD10K-CAM-*"
    exclude_image_patterns:
      - "COD10K-NonCAM-*"
    exclude_mask_patterns:
      - "COD10K-NonCAM-*"
    mask_match_strategy: same_stem
    category_name: camouflaged_object
    category_id: camouflaged_object
    default_difficulty_tags:
      - low_contrast
      - camouflaged_object

sampling:
  strategy: stratified
  image_diversity: true
  include_tags:
    - small_object
    - touches_border
    - elongated_object
    - low_contrast
    - camouflaged_object
