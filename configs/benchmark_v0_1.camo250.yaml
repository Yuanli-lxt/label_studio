benchmark_id: benchmark_v0_1_camo250
random_seed: 42
max_samples_total: 250

datasets:
  camo:
    enabled: true
    images_dir: data/external/camo/images
    masks_dir: data/external/camo/masks
    max_samples: 250
    image_glob: "**/*.jpg,**/*.jpeg,**/*.png,**/*.bmp"
    mask_glob: "**/*.png,**/*.jpg,**/*.bmp"
    mask_match_strategy: same_stem
    category_name: camouflaged_object
    category_id: camouflaged_object
    default_difficulty_tags:
      - low_contrast
      - camouflaged_object

sampling:
  strategy: stratified
  image_diversity: true
  include_tags:
    - small_object
    - touches_border
    - elongated_object
    - low_contrast
    - camouflaged_object
